name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Build app bundle
        run: ./scripts/bundle.sh
      - name: Check the bundle
        run: |
          plutil -lint build/ColimaUI.app/Contents/Info.plist
          codesign --verify --strict build/ColimaUI.app
          test -s build/ColimaUI.app/Contents/Resources/AppIcon.icns
      - name: Render cask template
        run: ./scripts/render-cask.sh 0.0.0 "$(printf 'x' | shasum -a 256 | cut -d' ' -f1)" | ruby -c
