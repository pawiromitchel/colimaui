name: Release

# Every merge to main publishes a new version: a GitHub release with a universal ColimaUI zip,
# and an updated Homebrew cask pointing at it.
#
# The bump is a patch by default. Put the label `minor` or `major` on the pull request to bump
# those instead, or `skip-release` to publish nothing for that merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Casks/**"
      - ".github/**"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # create the release and push the cask update
  pull-requests: read    # read the labels of the merged pull request

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          version=$(./scripts/next-version.sh "$latest" "$labels")
          if [ "$version" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: this merge is labelled skip-release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Releasing $version (previous: ${latest:-none})"
          fi

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          ./scripts/test-release.sh
          ./scripts/test.sh

      - name: Package
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package.sh

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/ColimaUI-$VERSION.zip" "dist/ColimaUI-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "ColimaUI $VERSION" --generate-notes

      - name: Update the Homebrew cask
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(cut -d' ' -f1 "dist/ColimaUI-$VERSION.zip.sha256")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/update-cask.sh "$VERSION" "$sha"
