name: Release

# Every merge to main publishes a new version: a GitHub release with a universal ColimaUI zip,
# and an updated Homebrew cask pointing at it.
#
# The bump is a patch by default. Put the label `minor` or `major` on the pull request to bump
# those instead, or `skip-release` to publish nothing for that merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Casks/**"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
          if grep -qx 'skip-release' <<<"$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version="0.1.0"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            if grep -qx 'major' <<<"$labels"; then major=$((major+1)); minor=0; patch=0
            elif grep -qx 'minor' <<<"$labels"; then minor=$((minor+1)); patch=0
            else patch=$((patch+1)); fi
            version="$major.$minor.$patch"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: ./scripts/test.sh

      - name: Package
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package.sh

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/ColimaUI-$VERSION.zip" "dist/ColimaUI-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "ColimaUI $VERSION" --generate-notes

      - name: Update the Homebrew cask
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(cut -d' ' -f1 "dist/ColimaUI-$VERSION.zip.sha256")
          mkdir -p Casks
          ./scripts/render-cask.sh "$VERSION" "$sha" > Casks/colimaui.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/colimaui.rb
          git commit -m "Update Homebrew cask to $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
